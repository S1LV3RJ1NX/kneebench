[project]
name = "kneebench"
version = "0.1.0.dev0"
description = "Benchmark your LLM inference server and get a report you can understand and act on."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Prathamesh", email = "pratamesh1867@gmail.com" }]
requires-python = ">=3.11,<3.14"
keywords = ["llm", "inference", "benchmark", "vllm", "aiperf", "latency", "throughput"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Benchmark",
    "Typing :: Typed",
]
dependencies = [
    "aiperf==0.13.0",
    "certifi>=2026.10.19",
    "fastapi>=0.146.0",
    "httpx>=0.28.1",
    "huggingface-hub>=1.33.0",
    "jinja2>=3.1.6",
    "packaging>=26.3",
    "platformdirs>=4.13.4",
    "playwright>=1.64.0",
    "plotly>=6.4.0",
    "prometheus-client>=0.23.1",
    "pydantic>=2.14.1",
    "pypdf>=6.21.1",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "rich>=14.1.0",
    "typer>=0.27.3",
    "uvicorn>=0.54.0",
]

[project.urls]
Homepage = "https://github.com/S1LV3RJ1NX/kneebench"
Repository = "https://github.com/S1LV3RJ1NX/kneebench"
Issues = "https://github.com/S1LV3RJ1NX/kneebench/issues"
Changelog = "https://github.com/S1LV3RJ1NX/kneebench/blob/main/CHANGELOG.md"

[project.scripts]
kneebench = "kneebench.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kneebench"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PTH", "N"]
# Reports use the multiplication sign for ratios, as the lesson notes do.
allowed-confusables = ["×"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["aiperf.*", "plotly.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: runs the bundled AIPerf against a local mock server",
    "live: hits a real endpoint from kneebench.local.toml or KNEEBENCH_E2E_URL (opt-in)",
]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
    "syrupy>=6.1.1",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.uv]
# Older uv trusted the compromised eMudhra intermediates (Oct 2026 certificate advisory).
required-version = ">=0.13.4"
