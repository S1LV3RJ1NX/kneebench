# Per-GPU peak numbers used for floors. Dense (non-sparse) tensor throughput.
# memory_mib is the total reported by nvidia-smi / rocm-smi, which is what vLLM's
# gpu_memory_utilization multiplies. Add entries via PR with a datasheet link.
# Unknown GPU? Use "custom" in the UI and type the numbers from its datasheet.

