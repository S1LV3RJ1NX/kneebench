# Report-level text: verdict sentences, scorecard tiles and caveats.
# Which sentence or status applies is decided in report/composer.py; the words live here.

verdict:
  capacity: >-
    For your {{ product_label }} traffic ({{ num(isl) }} tokens in, {{ num(osl) }} out), this
    server comfortably handles about {{ num(op) }} users at your target
    {%- if slo_tpot_ms %} of {{ ms(slo_tpot_ms) }} per token{% endif %}
    {%- if slo_ttft_ms %}{{ " and" if slo_tpot_ms else " of" }} {{ ms(slo_ttft_ms) }} to the first
    token{% endif %} for {{ pct_label }} out of 100 requests.
    {% if limiter == "saturation" %}Past about {{ num(c_star, 0) }} users it saturates: the GPU stops
    adding throughput and extra users only wait in line.{% else %}It breaks
    {%- if c_star | round(0) <= op %} just above that{% else %} at about {{ num(c_star, 0) }}{% endif %}
    because {{ limiter_text }}{% if memory_not_full %}, not because memory is
    full: the KV cache was only {{ pct(kv_at_break) }} used there{% endif %}.{% endif %}
  capacity_above_range: >-
    For your {{ product_label }} traffic ({{ num(isl) }} tokens in, {{ num(osl) }} out), this
    server met every target at {{ num(max_tested) }} users, the most this test tried, so its real
    capacity is higher; sweep further to find where it breaks.
  capacity_none: >-
    For your {{ product_label }} traffic ({{ num(isl) }} tokens in, {{ num(osl) }} out), no load
    level met your latency targets, not even one user at a time.
  gpu_mismatch: >-
    Before anything else: the measurements don't fit {{ gpu_label }}, so the GPU entry is probably
    wrong and every comparison with physics below is unreliable until it is fixed.
  decode_healthy: >-
    For one request at a time, {{ model }} on {{ gpu_label }} is healthy: it generates each token
    in {{ ms(tpot_ms) }}, {{ pct(mbu) }} of what the hardware allows.
  decode_slow: >-
    For one request at a time, {{ model }} on {{ gpu_label }} is slower than it should be: each
    token takes {{ ms(tpot_ms) }}, only {{ pct(mbu) }} of what the hardware allows.
  decode_very_slow: >-
    For one request at a time, {{ model }} on {{ gpu_label }} is far slower than it should be:
    {{ ms(tpot_ms) }} per token, {{ times(ratio) }} the physical limit. Fix this before load testing.
  network_dominates: >-
    From where this test ran, the network adds {{ ms(http_rtt_ms) }} to every first token
    ({% if dominates %}more than the server itself takes{% else %}{{ pct(share) }} of it{% endif %}),
    so run kneebench closer to the server for first-token numbers.
  short_outputs: >-
    Some answers came back shorter than requested, so latency and capacity look better than they
    really are.
  baseline_only_next: >-
    This run measured one request at a time; the concurrency sweep is what tells you how many
    {{ product_label }} users it can serve.

scorecard:
  baseline:
    label: Baseline vs physics
    ok: "{{ pct(mbu) }} of memory bandwidth"
    warn: "{{ pct(mbu) }} of memory bandwidth, below the healthy band"
    bad: "{{ times(ratio) }} slower than physics allows"
    mismatch: GPU entry looks wrong
    none: Not measured
  capacity:
    label: Capacity under your SLO
    ok: "{{ num(op) }} users ({{ num(op_tok_s, 0) }} tok/s) within your targets"
    warn: "At least {{ num(max_tested) }} users; the limit is above the tested range"
    bad: No load level met your targets
    none: Not measured in this run (needs the concurrency sweep)
  headroom:
    label: Headroom
    ok: "Run at {{ num(run_at) }} users or fewer to keep {{ pct(headroom) }} for bursts"
    none: Not measured in this run (needs the concurrency sweep)
  memory:
    label: Memory safety
    preempting: "Evicting requests from {{ num(concurrency) }} users"
    cap_too_high: "max_num_seqs {{ num(current) }} is above the {{ num(sustain) }} memory sustains"
    no_preemption: "No preemption; KV cache peaked at {{ pct(kv_max) }}"
    ok: "Startup fit {{ times(startup_fit) }}; preemption not tested yet"
    warn: "Only {{ times(startup_fit) }} full-length requests fit"
    bad: Not even one full-length request fits
    none: Not visible (no /metrics)
  reliability:
    label: Test reliability
    ok: No problems with the test itself
    warn: "{{ count }} caveat{{ 's' if count != 1 else '' }} to read before trusting the numbers"
    bad: "{{ count }} {{ 'problem changes' if count == 1 else 'problems change' }} the numbers"

caveats:
  always:
    - >-
      kneebench only sees the endpoint. It has no GPU telemetry; memory and queue signals come
      from vLLM's /metrics.
    - >-
      Prompts are random text, so they never share a beginning. Real traffic often repeats system
      prompts, which prefix caching can speed up; your real time to first token may be lower.
    - >-
      Results describe this server, with these flags, at this time. Change one setting at a time
      and rerun to compare.
  remote_client: >-
    This test ran {{ ms(http_rtt_ms) }} (one network round trip) away from the server. Time per
    token is reliable from here; first-token times include the network.
  no_metrics: >-
    /metrics was not reachable, so memory findings are estimates from the model's size rather
    than the server's own numbers.

# Shown when the report is re-judged against other latency targets.
what_if: >-
  What-if: this report judges the stored measurements against
  {% if judged_with.ttft_ms %}{{ ms(judged_with.ttft_ms) }} to the first token{% else %}no
  first-token target{% endif %} and {% if judged_with.tpot_ms %}{{ ms(judged_with.tpot_ms) }}
  per token{% else %}no per-token target{% endif %} at P{{ judged_with.percentile }}, instead
  of the targets the run used
  ({% if measured_with.ttft_ms %}{{ ms(measured_with.ttft_ms) }}{% else %}none{% endif %} and
  {% if measured_with.tpot_ms %}{{ ms(measured_with.tpot_ms) }}{% else %}none{% endif %} at
  P{{ measured_with.percentile }}). Nothing was re-run.
# How each phase is named inside sentences.
phase_labels:
  baseline: the baseline
  baseline_end: the closing baseline
  concurrency: the concurrency sweep
  rate: the request-rate sweep
  shape_prompt: the prompt-length sweep
  shape_output: the output-length sweep
  shape_map: the shape map
sections:
  verdict: Verdict
  scorecard: Scorecard
  problems: What needs attention
  capacity: How much load it takes
  shapes: How request size changes things
  context: What the hardware allows
  passed: Checks that passed
  skipped: Not checked
  next: Try these next
  next_server: Change your server
  next_server_intro: >-
    Settings for your vLLM server or deployment, most important first. Change one at a time and
    rerun, so you can see what each did.
  next_test: Make the test more reliable
  next_test_intro: >-
    These don't touch your server. They make the next run's numbers more trustworthy.
  caveats: What this test can't see
  glossary: Glossary
  appendix: "Appendix: raw numbers"
