id: W02
title: "Wall 2: missing your latency target"
status_line:
  ok: >-
    No latency target was crossed up to {{ users(max_tested) }}.
  info: >-
    P{{ pct_label }} {{ metric | upper }} crosses your {{ ms(target) }} target at about
    {{ num(at, 0) }} users{% if last_pass %} (fine at {{ num(last_pass) }}, {{ ms(value) }} at
    {{ num(first_fail) }}){% else %} (already at {{ num(first_fail) }}){% endif %}.
measured: >-
  {% for c in crossings %}{{ c.metric | upper }} crosses its target at about {{ num(c.at, 0) }}
  users{% if not loop.last %}; {% endif %}{% endfor %}. The crossing is interpolated between the
  last passing and first failing level.
  {% if ttft_offset_ms > 1 %} Time to first token is judged without the network: the
  {{ ms(ttft_offset_ms) }} round trip from where kneebench ran, and any new-connection setup, is
  removed, because it doesn't change with load and your users add their own. What's left is an
  estimate of the server's own time.{% endif %}
meaning: >-
  This is where users start getting a worse experience than you promised. It usually comes
  before throughput saturates, which makes it your real limit.
why: >-
  Latency grows slowly at first, bends up past the knee, and crosses the target well before the
  GPU stops adding throughput. Capacity is the first crossing, not the plateau.
learn_more: {note: "27", anchor: "3-wall-2-slo-failure", label: "Wall 2: SLO failure"}
