id: S03
title: Answer time grows in a straight line with output length
status_line:
  info: >-
    Each extra output token adds about {{ ms(per_token_ms) }}; a {{ num(longest_osl) }}-token
    answer takes {{ ms(longest_e2e_ms) }} for one user.
measured: >-
  One user at a time, answers from {{ num(rows[0].osl) }} to {{ num(longest_osl) }} tokens
  with {{ num(fixed_isl) }}-token prompts. The line starts at about {{ ms(intercept_ms) }}
  (prompt processing plus the network) and its slope is the time per output token.
meaning: >-
  Long answers are slow answers: reasoning models and long-form writing pay this per token,
  so cap max_tokens where your product allows and stream the output to users.
why: >-
  The answer is written one token per step ({{ term("decode") }}), and each step reads the
  whole model from memory. Output tokens are the expensive ones; the prompt is read once.
learn_more: {note: "26", anchor: "3-sweep-the-output-prompt-fixed-at-1000", label: "Sweep the output"}
table:
  rows: rows
  columns:
    - {key: osl, label: Output tokens, fmt: num}
    - {key: e2e_p50, label: E2E P50, fmt: ms}
    - {key: ttft_p50, label: TTFT P50, fmt: ms}
    - {key: tpot_p50, label: TPOT P50, fmt: ms}
