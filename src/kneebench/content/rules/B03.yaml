id: B03
title: Time to first token versus its floor
status_line:
  ok: >-
    Server-side time to first token is about {{ ms(server_ttft_ms) }} for a {{ num(isl) }}-token
    prompt ({{ times(ratio) }} its {{ ms(floor_ms) }} floor): normal for a short prompt.
  warn: >-
    Server-side time to first token is {{ ms(server_ttft_ms) }}, {{ times(ratio) }} its floor,
    while per-token speed is fine.
  skip: >-
    Server-side time to first token can't be separated from network time from this location (see
    "Distance between kneebench and the server").
measured: >-
  Median {{ term("TTFT") }} with the network round trip removed: {{ ms(server_ttft_ms) }}.
  Floor: {{ ms(floor_ms) }}.
meaning:
  ok: Prefill is behaving normally.
  warn: >-
    The GPU decodes fine, so the first-token delay comes from somewhere else: tokenization, a
    gateway, request queueing in front of the server, or a warm-up that didn't happen.
why: >-
  Prefill on a short prompt is mostly fixed overhead, so a few times the floor is normal (the
  lesson's clean run measured 21 ms against a 7.8 ms floor). Far beyond that while decode is
  healthy, the extra time isn't GPU work.
learn_more: {note: "24", anchor: "5-when-it-looks-off", label: "When it looks off"}
actions:
  - when: [warn]
    title: Run kneebench next to the server, on a machine that keeps up
    group: client
    expected: If time to first token drops, the delay was network or gateway, not vLLM.
    risk: None.
    verify: Rerun kneebench from a machine in the same cluster or region.
