id: W08
title: Headroom for bursts
status_line:
  ok: >-
    Plan for at most {{ num(run_at) }} users in flight to keep {{ pct(headroom) }} headroom below
    the {{ num(c_star, 0) }}-user limit.
measured: The limit (the lowest wall) times {{ pct(1 - headroom) }}.
meaning: >-
  Real traffic arrives in bursts. Running right at the limit means every burst pushes users past
  your target.
why: >-
  Capacity is the first wall; staying a margin below it absorbs random bunching of arrivals
  without breaking the target.
learn_more: {note: "27", anchor: "5-the-operating-envelope", label: "The operating envelope"}
