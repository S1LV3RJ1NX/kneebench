    - {key: waiting_max, label: Waiting (max), fmt: num0}
    - {key: step_tokens, label: Step tokens P99, fmt: num0}
    - {key: kv_max, label: Cache peak, fmt: pct}
    - {key: queue_tail_ms, label: Queue P99, fmt: ms}
