id: C05
title: The slow tail breaks first
status_line:
  ok: The target was judged on the P{{ pct_label }} tail, and medians didn't hide anything here.
  warn: >-
    At {{ users(concurrency) }} the median {{ metric | upper }} ({{ ms(median) }}) still looks
    fine, but P{{ pct_label }} ({{ ms(tail) }}) is past the {{ ms(target) }} target.
measured: >-
  Median and P{{ pct_label }} {{ metric | upper }} at {{ users(concurrency) }}.
meaning: >-
  {{ pct_label }} out of 100 requests must meet the target; the slowest ones are what users
  remember. A dashboard of medians would call this load fine.
why: >-
  Under load, a few requests land behind long prompts or wait for memory, so the tail grows
  faster than the median. Judging by medians lets the tail blow through the target unnoticed.
learn_more: {note: "25", anchor: "6-how-sweeps-quietly-go-wrong", label: "How sweeps quietly go wrong"}
