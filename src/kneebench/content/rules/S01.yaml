id: S01
title: Longer prompts delay the first token
status_line:
  info: >-
    Each 1,000 prompt tokens add about {{ ms(per_1k_ms) }} to the first token; a prompt of
    {{ num(longest_isl) }} tokens waits {{ ms(longest_ttft_ms) }}.
  warn: >-
    First-token time grows faster than the prompt: at {{ num(longest_isl) }} tokens it is
    {{ times(bend) }} what a straight line predicts ({{ ms(longest_ttft_ms) }}).
measured: >-
  One user at a time, prompts from {{ num(rows[0].isl) }} to {{ num(longest_isl) }} tokens with
  {{ num(fixed_osl) }}-token answers. The per-token cost is the slope of the line, so the
  network round trip drops out.{% if floor_per_token_us %} Physics allows about
  {{ num(floor_per_token_us, 0) }} µs per prompt token; measured is
  {{ num(per_token_us, 0) }} µs.{% endif %}
meaning:
  info: >-
    Budget first-token time from your real prompt sizes: long documents, chat history and
    retrieved context all pay this price before the first word.
  warn: >-
    Very long prompts cost more than their length suggests. Trim context, or expect much
    slower first tokens for them.
why: >-
  The server reads the whole prompt in one pass ({{ term("prefill") }}), limited by compute,
  so the work grows with prompt length. Attention compares every token with every earlier one,
  which grows with length squared and bends the line up for long prompts.
learn_more: {note: "26", anchor: "2-sweep-the-prompt-output-fixed-at-256", label: "Sweep the prompt"}
table:
  rows: rows
  columns:
    - {key: isl, label: Prompt tokens, fmt: num}
    - {key: ttft_p50, label: TTFT P50, fmt: ms}
    - {key: ttft_tail, label: TTFT tail, fmt: ms}
