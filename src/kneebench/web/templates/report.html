{% extends "base.html" %}
{% block title %}{{ report.title }}{% endblock %}
{% block main %}
<div class="toolbar no-print">
  <a class="button" href="/runs/{{ report.run_id }}/report.pdf">Download PDF</a>
  <button class="secondary" onclick="window.print()">Print</button>
  <a class="button secondary" href="/runs/{{ report.run_id }}/report.html">HTML</a>
  <a class="button secondary" href="/runs/{{ report.run_id }}/report.md">Markdown</a>
  <a class="button secondary" href="/runs/{{ report.run_id }}/report.json">JSON</a>
  <span class="spacer"></span>
  <form method="post" action="/runs/{{ report.run_id }}/delete"
        onsubmit="return confirm('Delete run #{{ report.run_id }} and its measurements? This cannot be undone.')">
    <button class="danger" type="submit">Delete</button></form>
</div>
{% include "report_body.html" %}
{% endblock %}
{% block scripts %}
{% if inline_assets %}<script>{{ plotly_js | safe }}</script>{% else %}<script src="/static/plotly.min.js"></script>{% endif %}
{% endblock %}
