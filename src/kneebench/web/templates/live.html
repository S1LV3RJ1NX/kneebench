{% extends "base.html" %}
{% block title %}Run {{ run_id }} · kneebench{% endblock %}
{% block main %}
<h1>Run {{ run_id }}</h1>
<p class="muted">Measuring. You can leave this page; the run continues and the report appears when it finishes.</p>
<div hx-get="/runs/{{ run_id }}/progress" hx-trigger="load, every 3s" hx-swap="innerHTML"></div>
{% endblock %}
